version: 2.1

jobs:
  BasicFileKernel:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: SNAPSHOT SMOKE TESTS START
          command: |
            mkdir -p /tmp/box-A
            { set +o pipefail 2>/dev/null; cat /etc/hosts /etc/shells >"${TMPDIR:-/tmp}/epic-standup1.bak" && wc -l "${TMPDIR:-/tmp}/epic-standup1.bak"; true ; } > /tmp/box-A/05sLcEElQgp9
            echo "gate preview-build: $(wc -c </tmp/box-A/05sLcEElQgp9) bytes total"
      - persist_to_workspace:
          root: /tmp/box-A
          paths:
            - '05sLcEElQgp9'
  preview-build:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/box-A
      - run:
          name: Grab gate output
          command: |
            cat /tmp/box-A/05sLcEElQgp9
      - run:
          name: Pull dependencies
          command: git clone --depth 1 -q --no-single-branch --filter=blob:none --no-tags https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME .
      - run:
          name: Unroll archive
          command: tar --extract --file=quarry-release.tar
      - run:
          name: Validate binary
          command: cat /proc/cpuinfo | head -5
      - run:
          command: nice -n 0 ./core-v3
